# CI for the RePoi Kotlin Multiplatform project (Android + Desktop).
#
# Runs on pushes to main and on pull requests:
# - android job (Linux): assembles the Android debug APK, runs shared unit
#   tests (JVM) and Android host tests
# - desktop job (Linux + Windows matrix): packages the desktop app for each
#   OS (.deb on Linux, .msi on Windows)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android app and run tests
        run: ./gradlew :androidApp:assembleDebug :shared:jvmTest :shared:testAndroidHostTest --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: desktop-dist-linux
          - os: windows-latest
            artifact: desktop-dist-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Needed to configure the shared module's Android target, even though
      # only the desktop (JVM) distribution is packaged here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package desktop distribution
        shell: bash
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      # M6: Windows 可运行镜像（R4 开箱可启动）。createDistributable 产出
      # binaries/main/app/<packageName>/ 下的镜像（含 Windows launcher exe），
      # 供下面的存在性断言验证。
      - name: Build Windows runnable image
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./gradlew :desktopApp:createDistributable --stacktrace

      # M6: Windows MSI 显式打包（R4 可安装产物）。packageMsi 与
      # packageDistributionForCurrentOS 同为 jpackage 系任务，共享输出目录。
      - name: Package Windows MSI installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./gradlew :desktopApp:packageMsi --stacktrace

      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/
          if-no-files-found: error

      # M6: Windows 安装器/启动器存在性断言（*.msi + 可运行镜像 *.exe 非空）。
      # exe 位于 createDistributable 产出的 binaries/main/app/<packageName>/ 下。
      - name: Assert Windows installer artifacts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          shopt -s nullglob
          msi=(desktopApp/build/compose/binaries/main/msi/*.msi)
          exe=(desktopApp/build/compose/binaries/main/app/com.nobody.repoi/*.exe)
          if [ ${#msi[@]} -eq 0 ]; then echo "missing *.msi under binaries/main/msi"; exit 1; fi
          if [ ${#exe[@]} -eq 0 ]; then echo "missing *.exe under binaries/main/app"; exit 1; fi
          for f in "${msi[@]}" "${exe[@]}"; do
            if [ ! -s "$f" ]; then echo "empty artifact: $f"; exit 1; fi
            echo "ok: $f"
          done
