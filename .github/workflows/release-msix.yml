# Release workflow: MSIX packaging only (slow, win-only, UNSIGNED trial).
#
# Split out of CI: `createMsix` dominated the windows desktop job (~10min+),
# and MSIX is only needed at release time. Triggered by version tags or
# manually from the Actions tab.
name: Release MSIX

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Disable Windows Defender
        shell: pwsh
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true
            Write-Host "Windows Defender 实时防护与 I/O 检查已禁用"
          } catch {
            Write-Warning "禁用 Windows Defender 失败：$($_.Exception.Message)"
          }

      - name: Set up Gradle environment
        uses: ./.github/actions/gradle-setup
        with:
          setup-android: false

      - name: Package Windows MSIX
        shell: bash
        run: ./gradlew :desktopApp:createMsix --stacktrace

      - name: Assert MSIX trial artifact
        shell: bash
        run: |
          shopt -s nullglob
          msix=(desktopApp/build/com.nobody.repoi.msix)
          if [ ${#msix[@]} -eq 0 ]; then echo "missing *.msix under desktopApp/build"; exit 1; fi
          for f in "${msix[@]}"; do
            if [ ! -s "$f" ]; then echo "empty artifact: $f"; exit 1; fi
            echo "ok (unsigned trial): $f"
          done

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-msix-windows
          path: desktopApp/build/com.nobody.repoi.msix
          if-no-files-found: error
