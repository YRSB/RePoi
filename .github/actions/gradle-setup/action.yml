name: "Gradle & Java Setup"
description: "统一配置 JDK 21、Android SDK 以及 Gradle 缓存环境"

inputs:
  setup-android:
    description: "是否配置 Android SDK 环境"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      if: ${{ inputs.setup-android == 'true' }}
      uses: android-actions/setup-android@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
