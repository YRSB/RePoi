#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseG1GC

#Gradle
org.gradle.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Project proxy bypass (M1: dl.google.com rejected via intercepting proxy; parent-authorized)
systemProp.http.nonProxyHosts=dl.google.com
systemProp.https.nonProxyHosts=dl.google.com
